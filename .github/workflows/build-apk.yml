name: Build APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: |
          chmod +x gradlew && node -e 'const fs=require("fs"),zlib=require("zlib"),p="app/src/main/assets/web/index.html",h=fs.readFileSync(p,"utf8"),sM="/* ============================================================\n   TWEMOJI",eM="/* ============================================================\n   STATE",sI=h.indexOf(sM),eI=h.indexOf(eM);if(sI<0||eI<=sI)throw new Error("Markers");const c=zlib.gunzipSync(Buffer.from("","base64")).toString("utf8");fs.writeFileSync(p,h.slice(0,sI)+sM+"\n   ============================================================ */\n"+c+"\n\n"+h.slice(eI),"utf8");console.log("Updated index.html");' && if [ -n "$(git status --porcelain app/src/main/assets/web/index.html 2>/dev/null)" ]; then git config user.name "Deyaa488" && git config user.email "Deyaa488@users.noreply.github.com" && git add app/src/main/assets/web/index.html && git commit -m "Upgrade emoji system to Twemoji v17.0.3 (Unicode 17.0) with 3D glossy shader and live input rendering [skip ci]" && (git push origin HEAD:feature/clean-android-upload-fresh || true); fi && rm -rf /tmp/tw app/src/main/assets/web/emoji/svg && git clone --depth 1 --branch v17.0.3 https://github.com/jdecked/twemoji.git /tmp/tw && mkdir -p app/src/main/assets/web/emoji/svg && cp /tmp/tw/assets/svg/*.svg app/src/main/assets/web/emoji/svg/ && node -e 'const fs=require("fs"),path=require("path"),dir="app/src/main/assets/web/emoji/svg",files=fs.readdirSync(dir).filter(f=>f.endsWith(".svg")),defs="<defs><radialGradient id=\"jpY\" cx=\"34%\" cy=\"25%\" r=\"70%\"><stop offset=\"0%\" stop-color=\"#FFF296\"/><stop offset=\"48%\" stop-color=\"#FFCC4D\"/><stop offset=\"88%\" stop-color=\"#F4900C\"/><stop offset=\"100%\" stop-color=\"#D97706\"/></radialGradient><radialGradient id=\"jpR\" cx=\"34%\" cy=\"25%\" r=\"70%\"><stop offset=\"0%\" stop-color=\"#FF788E\"/><stop offset=\"50%\" stop-color=\"#DD2E44\"/><stop offset=\"100%\" stop-color=\"#9E1226\"/></radialGradient><radialGradient id=\"jpB\" cx=\"34%\" cy=\"25%\" r=\"70%\"><stop offset=\"0%\" stop-color=\"#8CD0FF\"/><stop offset=\"52%\" stop-color=\"#55ACEE\"/><stop offset=\"100%\" stop-color=\"#226699\"/></radialGradient><radialGradient id=\"jpG\" cx=\"34%\" cy=\"25%\" r=\"70%\"><stop offset=\"0%\" stop-color=\"#A6E27E\"/><stop offset=\"52%\" stop-color=\"#77B255\"/><stop offset=\"100%\" stop-color=\"#3E721D\"/></radialGradient><radialGradient id=\"jpP\" cx=\"34%\" cy=\"25%\" r=\"70%\"><stop offset=\"0%\" stop-color=\"#D4B8FF\"/><stop offset=\"52%\" stop-color=\"#AA8ED6\"/><stop offset=\"100%\" stop-color=\"#553788\"/></radialGradient></defs>";let al=0;for(const f of files){const p=path.join(dir,f);let s=fs.readFileSync(p,"utf8");if(!s.includes("id=\"jpY\"")){s=s.replace(/<svg([^>]*)>/,"<svg$1>"+defs).replace(/fill=\"#FFCC4D\"/gi,"fill=\"url(#jpY)\"").replace(/fill=\"#DD2E44\"/gi,"fill=\"url(#jpR)\"").replace(/fill=\"#55ACEE\"/gi,"fill=\"url(#jpB)\"").replace(/fill=\"#77B255\"/gi,"fill=\"url(#jpG)\"").replace(/fill=\"#AA8ED6\"/gi,"fill=\"url(#jpP)\"");fs.writeFileSync(p,s,"utf8");}if(f.includes("-fe0f")){const nf=path.join(dir,f.replace(/-fe0f/g,""));if(!fs.existsSync(nf)){fs.copyFileSync(p,nf);al++;}}}for(const b of ["2764","1f3f3","263a","26a0","2728","270c","270b","270a","261d"]){const sc=path.join(dir,b+".svg"),ds=path.join(dir,b+"-fe0f.svg");if(fs.existsSync(sc)&&!fs.existsSync(ds)){fs.copyFileSync(sc,ds);al++;}}console.log("Base SVGs:",files.length,"Aliases:",al,"Total SVGs:",fs.readdirSync(dir).length);' && du -sh app/src/main/assets/web/emoji/svg
          ls -l gradlew
          test -x gradlew

      - name: Build Optimized Staging APK (arm64-v8a + R8)
        run: |
          bash ./gradlew :app:assembleStaging \
            -Pknit.stagingAbis=arm64-v8a \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Build Debug APK (arm64-v8a)
        run: |
          bash ./gradlew :app:assembleDebug \
            -Pknit.debugAbis=arm64-v8a \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify Produced APKs
        run: |
          ls -lh app/build/outputs/apk/staging/*.apk app/build/outputs/apk/debug/*.apk 
          APK_PATH=$(ls app/build/outputs/apk/staging/app-staging.apk 2>/dev/null || ls app/build/outputs/apk/staging/*.apk | head -n 1) && unzip -p "$APK_PATH" assets/web/index.html > /tmp/apk-index.html && echo "Packaged SVGs: $(unzip -l "$APK_PATH" | grep "assets/web/emoji/svg/" | wc -l)" && for s in 1f600.svg 1f602.svg 1f979.svg 1fae0.svg 1fae8.svg 1fae9.svg 1faea.svg 1f9d1-200d-1f9d1-200d-1f9d2-200d-1f9d2.svg 1f468-1f3fd-200d-1f91d-200d-1f468-1f3fb.svg 1f3f3-fe0f-200d-1f308.svg 1f1f2-1f1e6.svg 2764.svg 2764-fe0f-200d-1f525.svg 1f469-200d-1f4bb.svg; do unzip -l "$APK_PATH" | grep -q "assets/web/emoji/svg/$s" || exit 1; done
          node -e 'const fs=require("fs");for(const p of ["app/src/main/assets/web/index.html","/tmp/apk-index.html"]){const h=fs.readFileSync(p,"utf8");for(const t of ["style","script","body"]){const o=(h.match(new RegExp("<"+t+"(?:\\s|>)","gi"))||[]).length,c=(h.match(new RegExp("</"+t+">","gi"))||[]).length;console.log(p,t,"open="+o,"close="+c);if(o!==c||o===0)throw new Error(p+" unbalanced "+t);}const m=[...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];m.forEach((x,i)=>{if(x[1].trim()){new (require("vm")).Script(x[1]);console.log(p,"script#"+i,"OK","len="+x[1].length);}});}'

      - name: Upload Optimized Staging APK
        uses: actions/upload-artifact@v4
        with:
          name: knit-messenger-staging-apk
          path: app/build/outputs/apk/staging/*.apk
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: knit-messenger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

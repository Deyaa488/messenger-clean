name: Build APK

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: |
          chmod +x gradlew
          ls -l gradlew
          test -x gradlew

      - name: Build Optimized Staging APK (arm64-v8a + R8)
        run: |
          bash ./gradlew :app:assembleStaging \
            -Pknit.stagingAbis=arm64-v8a \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Build Debug APK (arm64-v8a)
        run: |
          bash ./gradlew :app:assembleDebug \
            -Pknit.debugAbis=arm64-v8a \
            --no-daemon --stacktrace --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

      - name: Verify Produced APKs
        run: |
          ls -lh app/build/outputs/apk/staging/*.apk app/build/outputs/apk/debug/*.apk

      - name: Upload Optimized Staging APK
        uses: actions/upload-artifact@v4
        with:
          name: knit-messenger-staging-apk
          path: app/build/outputs/apk/staging/*.apk
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: knit-messenger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
